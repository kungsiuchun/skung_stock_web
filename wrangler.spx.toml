name = "spx-trading-pua"
main = "scripts/worker-spx-bot.ts"
compatibility_date = "2024-12-30"
compatibility_flags = [ "nodejs_compat" ]

[triggers]
# Cloudflare cron uses UTC. The Worker gates the real NYSE calendar and ET windows.
# Trading: 10:00-15:45 ET every 15 minutes, 10:00-12:45 ET on early closes.
# Audit: 16:15 ET, or 13:15 ET on early closes.
# SPX GEX heatmap: collect 09:45-16:15 ET, display 09:30-16:00 ET as a 15-min delayed feed.
# One supervised market tick owns GEX collection and (when open) trading.  Running
# separate cron handlers at the same minute allowed the trading path to read a
# partially-written canonical GEX snapshot.
crons = [ "15 17-21 * * MON-FRI", "*/15 13-21 * * MON-FRI" ]

[[durable_objects.bindings]]
name = "SPX_SCHEDULER"
class_name = "SpxMarketScheduler"

[[migrations]]
tag = "v1"
new_sqlite_classes = [ "SpxMarketScheduler" ]

[observability]
enabled = true

[version_metadata]
binding = "CF_VERSION_METADATA"

[[kv_namespaces]]
binding = "SPX_MEMORY"
id = "d885526d2249419eaf921dcb7dd27488"

[[d1_databases]]
binding = "SPX_RECAP_DB"
database_name = "spx-recap-db"
database_id = "00a4729d-1792-42d1-bd86-ed58dfe1f95f"

[vars]
# Non-sensitive default variables.
OPENROUTER_MODEL = "openai/gpt-5-mini"
SPX_COUNCIL_MODEL = "openai/gpt-5-mini"
SPX_CIO_MODEL = "openai/gpt-5-mini"
SPX_BOARD_URL = "https://sius-ai-workshop.pages.dev/#/work/spx-gex-heatmap"

# Sensitive values (TELEGRAM_TOKEN, TELEGRAM_CHAT_ID, OPENROUTER_API_KEY)
# should be set with `wrangler secret put`, not committed here.
